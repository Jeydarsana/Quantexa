version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    container_name: quantlens_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend
    container_name: quantlens_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
